services:
  retriever:
    build:
      context: .
      dockerfile: docker/Dockerfile.retriever
    environment:
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-5.0}
      QDRANT_PREFER_GRPC: ${QDRANT_PREFER_GRPC:-false}
      QDRANT_HOST: ${QDRANT_HOST:-}
      QDRANT_HTTP_PORT: ${QDRANT_HTTP_PORT:-6333}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AUTH_BEARER_TOKEN: ${AUTH_BEARER_TOKEN:-}
    expose:
      - "8080"
    restart: unless-stopped
